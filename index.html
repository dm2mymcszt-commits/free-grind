<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/webp" href="/newLogo.webp" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Free Grind</title>
	</head>

	<body>
		<script>
			// Detect Tauri BEFORE React mounts to prevent white corner flash.
			// Without this, the WebView2 paints white behind the rounded CSS corners
			// for a brief moment before JS adds the has-titlebar class.
			if (window.__TAURI_INTERNALS__) {
				document.documentElement.classList.add('has-titlebar');
				document.body.classList.add('has-titlebar');
				document.documentElement.style.background = 'transparent';
				document.body.style.background = 'transparent';
			}
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
