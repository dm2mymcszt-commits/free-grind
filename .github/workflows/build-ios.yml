name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to the branch this workflow is on)'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend assets
        run: bun run build

      - name: Build iOS app (production mode, unsigned)
        id: ios_build
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/ios-derived"

          # `tauri ios build` (NOT init) is required for production mode.
          # It: initialises the Xcode project, compiles Rust in production mode
          # (cfg(dev) is NOT set → WKWebView loads embedded assets, not localhost:1420),
          # and runs xcodebuild. Extra args after `--` are forwarded to xcodebuild.
          bunx tauri ios build --ci \
            --target aarch64-apple-ios \
            -- \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            EXPANDED_CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_ALLOWED_FOR_APPS=NO

          # Find the built .app bundle
          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products" \
            -maxdepth 2 -type d -name '*.app' \
            | grep -Ei '/(release|Release)-iphoneos/' | head -n 1 || true)

          if [ -z "$APP_PATH" ]; then
            echo "Derived data search missed, scanning broader..."
            APP_PATH=$(find "$DERIVED_DATA_PATH" -type d -name '*.app' \
              | grep -v simulator | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Could not find .app bundle after build"
            find "$DERIVED_DATA_PATH" -name '*.app' 2>/dev/null || true
            exit 1
          fi

          echo "Found .app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        id: ios_ipa
        run: |
          APP_PATH='${{ steps.ios_build.outputs.app_path }}'
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Cannot package IPA; app bundle missing at $APP_PATH"
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/free-grind-unsigned.ipa"

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-unsigned-ipa
          path: ${{ steps.ios_ipa.outputs.ipa_path }}
          retention-days: 14
          if-no-files-found: error
