name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build iOS unsigned IPA
        run: |
          # Build the iOS project without requiring a developer certificate (perfect for sideloading!)
          npm run tauri ios build -- --export-method development -- --xcodebuild-args "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"-\" EXPANDED_CODE_SIGN_IDENTITY=\"-\""

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-ios-app
          path: src-tauri/gen/apple/build/arm64/*.ipa
